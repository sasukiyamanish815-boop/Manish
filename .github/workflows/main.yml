name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Extract ZIP
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          echo "ZIP files:"
          find . -maxdepth 2 -type f -iname "*.zip" -print

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -100

      # 4. Find Android Gradle project
      - name: Find Android Gradle project
        shell: bash
        run: |
          set -e

          echo "Searching for Gradle project..."

          PROJECT_DIR=""

          SETTINGS_FILE=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(find extracted -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -not -path "*/.gradle/*" \
              | head -n 1)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "Files inside ZIP:"
            find extracted -maxdepth 6 -print
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5. Check project
      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "Project files:"
          ls -la

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradle-wrapper.properties" \) \
            -print

      # 6. Setup Gradle 9.3.1
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 7. Build Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building Android APK..."
          echo "Current directory:"
          pwd

          echo ""
          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Starting APK build..."

          gradle assembleDebug --stacktrace --no-daemon

      # 8. Find APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo "Searching all APK files:"
            find "$PROJECT_DIR" -type f -name "*.apk" -print

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p apk-output
          cp "$APK" apk-output/Mojilo-Manish-debug.apk

          echo "APK copied successfully."

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mojilo-Manish-APK
          path: apk-output/Mojilo-Manish-debug.apk
          if-no-files-found: error
