name: Build Mojilo Manish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup JDK 17
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # 3. Find and Extract the uploaded ZIP
      # --------------------------------------------------
      - name: Extract Android Project ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for uploaded ZIP..."
          echo "======================================"

          # Prefer the latest ZIP you uploaded
          ZIP_FILE=""

          if [ -f "mojilo-manish-question-management-update.zip" ]; then
            ZIP_FILE="mojilo-manish-question-management-update.zip"
          else
            ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" \
              -not -path "./.git/*" \
              -printf "%T@ %p\n" | sort -nr | head -n 1 | cut -d' ' -f2-)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP selected:"
          echo "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "======================================"
          echo "ZIP extracted successfully"
          echo "======================================"

          find extracted -maxdepth 4 -type f | head -150


      # --------------------------------------------------
      # 4. Find Android Gradle Project
      # --------------------------------------------------
      - name: Find Android Gradle Project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Android Gradle project..."
          echo "======================================"

          PROJECT_DIR=""

          # First look for settings.gradle / settings.gradle.kts
          SETTINGS_FILE=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          # If settings file wasn't found, search for build.gradle
          if [ -z "$PROJECT_DIR" ]; then

            BUILD_FILE=$(find extracted -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -not -path "*/.gradle/*" \
              | head -n 1)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi

          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "ERROR: Android Gradle project not found."
            echo ""
            echo "Files inside extracted ZIP:"
            find extracted -maxdepth 8 -print
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "Android project found:"
          echo "$PROJECT_DIR"
          echo "======================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 5. Automatically Fix Common Compose Imports
      # --------------------------------------------------
      - name: Fix Kotlin Compose Imports
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Checking Kotlin Compose imports..."
          echo "======================================"

          cd "$PROJECT_DIR"

          find . -type f -name "*.kt" \
            -not -path "*/build/*" \
            -print0 | while IFS= read -r -d '' FILE
          do

            # ------------------------------------------
            # fillMaxWidth
            # ------------------------------------------
            if grep -qE '\.fillMaxWidth\(|Modifier\.fillMaxWidth\(' "$FILE"; then
              if ! grep -q 'import androidx.compose.foundation.layout.fillMaxWidth' "$FILE" \
                 && ! grep -q 'import androidx.compose.foundation.layout.\*' "$FILE"; then

                echo "Adding fillMaxWidth import to:"
                echo "$FILE"

                sed -i '/^package /a import androidx.compose.foundation.layout.fillMaxWidth' "$FILE"
              fi
            fi


            # ------------------------------------------
            # fillMaxSize
            # ------------------------------------------
            if grep -qE '\.fillMaxSize\(|Modifier\.fillMaxSize\(' "$FILE"; then
              if ! grep -q 'import androidx.compose.foundation.layout.fillMaxSize' "$FILE" \
                 && ! grep -q 'import androidx.compose.foundation.layout.\*' "$FILE"; then

                echo "Adding fillMaxSize import to:"
                echo "$FILE"

                sed -i '/^package /a import androidx.compose.foundation.layout.fillMaxSize' "$FILE"
              fi
            fi


            # ------------------------------------------
            # fillMaxHeight
            # ------------------------------------------
            if grep -qE '\.fillMaxHeight\(|Modifier\.fillMaxHeight\(' "$FILE"; then
              if ! grep -q 'import androidx.compose.foundation.layout.fillMaxHeight' "$FILE" \
                 && ! grep -q 'import androidx.compose.foundation.layout.\*' "$FILE"; then

                echo "Adding fillMaxHeight import to:"
                echo "$FILE"

                sed -i '/^package /a import androidx.compose.foundation.layout.fillMaxHeight' "$FILE"
              fi
            fi


            # ------------------------------------------
            # wrapContentWidth
            # ------------------------------------------
            if grep -qE '\.wrapContentWidth\(' "$FILE"; then
              if ! grep -q 'import androidx.compose.foundation.layout.wrapContentWidth' "$FILE" \
                 && ! grep -q 'import androidx.compose.foundation.layout.\*' "$FILE"; then

                echo "Adding wrapContentWidth import to:"
                echo "$FILE"

                sed -i '/^package /a import androidx.compose.foundation.layout.wrapContentWidth' "$FILE"
              fi
            fi


            # ------------------------------------------
            # wrapContentHeight
            # ------------------------------------------
            if grep -qE '\.wrapContentHeight\(' "$FILE"; then
              if ! grep -q 'import androidx.compose.foundation.layout.wrapContentHeight' "$FILE" \
                 && ! grep -q 'import androidx.compose.foundation.layout.\*' "$FILE"; then

                echo "Adding wrapContentHeight import to:"
                echo "$FILE"

                sed -i '/^package /a import androidx.compose.foundation.layout.wrapContentHeight' "$FILE"
              fi
            fi

          done

          echo ""
          echo "Compose import check completed."


      # --------------------------------------------------
      # 6. Show project files
      # --------------------------------------------------
      - name: Check Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "PROJECT DIRECTORY"
          echo "======================================"

          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Gradle files:"
          find . -maxdepth 4 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradle-wrapper.properties" \) \
            -print


      # --------------------------------------------------
      # 7. Setup Gradle 9.3.1
      # --------------------------------------------------
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'


      # --------------------------------------------------
      # 8. Build Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          echo ""
          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Starting Debug APK build..."

          gradle assembleDebug \
            --no-daemon \
            --stacktrace


      # --------------------------------------------------
      # 9. Find APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then

            echo ""
            echo "ERROR: APK was not generated."

            echo ""
            echo "Searching all APK files:"
            find "$PROJECT_DIR" -type f -name "*.apk" -print

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_FILE"

          mkdir -p apk-output

          cp "$APK_FILE" \
            apk-output/Mojilo-Manish-debug.apk

          echo ""
          echo "APK copied successfully."


      # --------------------------------------------------
      # 10. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mojilo-Manish-APK
          path: apk-output/Mojilo-Manish-debug.apk
          if-no-files-found: error
