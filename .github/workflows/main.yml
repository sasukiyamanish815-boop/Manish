name: Build Mojilo Manish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Find Android Gradle project
        id: find_project
        shell: bash
        run: |
          echo "Searching for Gradle project..."

          PROJECT_DIR=$(find . -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found."
            echo "Repository files:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "Gradle project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check build environment
        run: |
          java -version
          gradle --version
          echo "Project directory:"
          echo "${{ steps.find_project.outputs.project_dir }}"

      - name: Build Debug APK
        shell: bash
        run: |
          PROJECT="${{ steps.find_project.outputs.project_dir }}"

          echo "Building project from: $PROJECT"

          cd "$PROJECT"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."

          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mojilo-manish-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
